[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hbb-jet-classification"
version = "0.1.0"
description = "H → bb vs QCD jet classification on CMS high-level features"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.0.3,<3",
    "numpy>=1.24,<2",
    "matplotlib>=3.7,<4",
    "seaborn>=0.12,<0.14",
    "scikit-learn>=1.3,<1.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
hbb-prepare-data = "hbb_classification.prepare:main"
hbb-train = "hbb_classification.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I"]
